name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -m 'not gpu'
      - run: ruff check src tests
